run:
  timeout: 5m
  tests: true

linters-settings:
  govet:
    enable-all: true
  gofmt:
    simplify: true
  revive:
    severity: warning
    rules:
      - name: exported
        arguments:
          - checkPrivateReceivers
          - sayRepetitiveInsteadOfStutter

linters:
  enable:
    - errcheck
    - gofmt
    - govet
    - ineffassign
    - revive
    - staticcheck
    - unused

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0

